<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fast — Ring + Dot icon</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { background: #ecebe6; margin: 0; }

  .icon-stage {
    --paper:      #f6f3ee;
    --ink:        #14130f;
    --ink-2:      #3a3a36;
    --muted:      #6f6a60;
    --primary:    #2a4d3e;
    --accent:     #d97757;
    --cream:      #fdfbf7;
    --border:     #e1dccf;

    font-family: 'Geist', -apple-system, sans-serif;
    color: var(--ink);
    background: #fafaf6;
    padding: 32px 28px;
    width: 360px;
    height: 440px;
    box-sizing: border-box;
    position: relative;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .icon-stage .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  .icon-stage .eyebrow {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .icon-stage .label {
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin-top: 4px;
  }
  .icon-stage .desc {
    font-size: 11px;
    line-height: 1.5;
    color: var(--ink-2);
    margin-top: 6px;
    max-width: 320px;
  }
  .icon-stage .swatch-row {
    display: flex; gap: 6px; margin-top: 10px;
  }
  .icon-stage .swatch {
    width: 14px; height: 14px; border-radius: 4px;
    border: 1px solid rgba(20,19,15,0.08);
  }

  .squircle {
    border-radius: 22.37%;
    overflow: hidden;
    position: relative;
    box-shadow:
      0 18px 36px -16px rgba(20,19,15,0.30),
      0 4px 10px -3px rgba(20,19,15,0.18),
      0 0 0 1px rgba(20,19,15,0.04);
    flex-shrink: 0;
  }

  .icon-row {
    display: flex;
    align-items: flex-end;
    gap: 18px;
    margin-top: auto;
  }
  .size-tag {
    font-family: 'Geist Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-align: center;
    margin-top: 8px;
  }
  .preview-col {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Spec card chrome */
  .spec-card {
    --paper:      #f6f3ee;
    --ink:        #14130f;
    --ink-2:      #3a3a36;
    --muted:      #6f6a60;
    --primary:    #2a4d3e;
    --accent:     #d97757;
    --border:     #e1dccf;

    background: #fafaf6;
    border: 1px solid #efeadf;
    border-radius: 18px;
    padding: 32px 36px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    font-family: 'Geist', -apple-system, sans-serif;
    color: var(--ink);
  }
  .spec-card .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  .spec-card .eyebrow {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .spec-card .title {
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.015em;
    color: var(--ink);
    margin-top: 4px;
  }
  .spec-card .spec-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .spec-card .spec-footer {
    display: flex;
    align-items: center;
    gap: 18px;
    padding-top: 18px;
    margin-top: 18px;
    border-top: 1px solid var(--border);
    font-size: 13px;
  }
  .spec-card .spec-footer .mono {
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--muted);
  }
  .spec-card .spec-footer a {
    color: var(--ink);
    text-decoration: none;
    font-weight: 500;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    transition: background .15s;
  }
  .spec-card .spec-footer a:hover {
    background: var(--paper);
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ring-dot.jsx"></script>
</body>
</html>
